name: release

# Pushing a tag like v0.1.0 tests the code, builds the app for Linux, macOS and Windows, and
# publishes a GitHub release with the archives, their checksums, and the tag's section of
# CHANGELOG.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name=waypoint-ops_${VERSION#v}_${os}_${arch}
            exe=waypoint-ops
            if [ "$os" = windows ]; then exe=waypoint-ops.exe; fi
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$exe" ./cmd/waypoint-ops
            cp README.md CHANGELOG.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The tag's section of the changelog: from its heading to the next one.
          awk -v v="${VERSION#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ") || $0 ~ (" " v "$")) found=1; next }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag
